[project]
name = "vacation-tracker-backend"
version = "0.1.0"
description = "Система учёта отпусков — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "ldap3>=2.9,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "bcrypt>=4.1,<5",
  "pyjwt>=2.9,<3",
  "cryptography>=42,<44",
  "python-multipart>=0.0.9",
  "aiosmtplib>=3.0,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<0.24",
  "httpx>=0.27,<0.28",
  "ruff>=0.5,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# W605 (invalid escape sequence in a non-raw string, e.g. `\d` outside
# `r"..."`) - PR #156 review: scripts/check_task_checkbox.py's module
# docstring had exactly this, undetected because the W group wasn't
# selected. Only W605 here, not the whole W group: a repo-wide run of
# `ruff check --select W .` on the current tree finds nothing else in
# that group at all - the rest of it stays off since nothing today
# needs it, rather than opening up pycodestyle's full warning surface
# (line length, blank-line whitespace, etc.) on a guess.
extend-select = ["W605"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-rs` — причины пропусков (нужно PYTEST_FORBID_SKIPS, conftest.py).
# `-rf` — короткая сводка `FAILED <nodeid>` в конце ВСЕГДА, а не только
# при просмотре полного лога. `--tb=short` держит трассировку каждого
# падения компактной. Оба добавлены после PR #139 review (третий
# круг): полный `make test-backend` один раз дал «3 failed» без единого
# имени — длинный вывод обрезался раньше, чем до сводки. Имя упавшего
# теста обязано переживать обрезание вывода независимо от того, кто и
# как запускает прогон.
addopts = "-rfs --tb=short"
