# Dev-окружение (T-M0-04). Прод-развёртывание — docs/plan.md §8, задачи M7.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vacation_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-vacation_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Создаёт vacation_tracker_test при первой инициализации тома
      # (T-M1-31) — см. postgres/init/01-create-test-db.sql.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacation_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Тестовый LDAP-каталог (не боевой AD компании) — T-M0-04, A-8, T-001.
  # Переключение на боевой LDAP/AD — T-M8-02.
  # Образ закреплён на bitnamilegacy (свежие теги bitnami/* ушли за
  # платную подписку Bitnami Secure Images) — этого достаточно для
  # тестового каталога разработки/CI, не для прод-эксплуатации.
  # Тег закреплён по digest, а не по имени: bitnamilegacy не поддерживается,
  # и тег может быть перезаписан под собой другим содержимым.
  openldap:
    image: bitnamilegacy/openldap@sha256:966fd39ed25813890e9bd57dac56def163bbcfe64967e0bae59ab018d505bd93
    restart: unless-stopped
    environment:
      LDAP_ROOT: dc=company,dc=local
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-changeme}
      LDAP_CUSTOM_LDIF_DIR: /ldifs
    volumes:
      - ./openldap/seed:/ldifs:ro
      - openldap_data:/bitnami/openldap
    ports:
      - "389:1389"
      - "636:1636"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      - ../backend/tests:/app/tests
      # `make openapi-client` (`scripts/export_openapi.py`) writes this
      # file inside the container; `frontend`'s codegen step then reads
      # it from the HOST. Without this mount the two see different
      # files and the client silently regenerates from a stale schema.
      - ../backend/openapi.json:/app/openapi.json
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app

  frontend:
    build:
      # T-M1-24: контекст — корень репозитория, не frontend/ саму по себе
      # (как у backend ниже) — `frontend/scripts/check-node-version.mjs`
      # читает `.nvmrc` двумя каталогами выше себя, и это разрешается
      # только если образ сохраняет ту же глубину вложенности, что и
      # реальный чекаут (см. комментарий в `frontend/Dockerfile`).
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/index.html:/app/frontend/index.html
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"

volumes:
  postgres_data:
  openldap_data:
