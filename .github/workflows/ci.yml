# CI для проекта «Система учёта отпусков».
#
# Активируется полноценно после выполнения этапа M0 (docs/tasks.md), когда
# в репозитории появятся backend/pyproject.toml и frontend/package.json
# с ожидаемыми скриптами. До этого job'ы ожидаемо будут падать на шаге
# установки зависимостей — это нормально для пустого каркаса.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vacation_app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vacation_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vacation_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run DB migrations (test DB)
        env:
          DATABASE_URL: postgresql+asyncpg://vacation_app:test@localhost:5432/vacation_tracker_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://vacation_app:test@localhost:5432/vacation_tracker_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
          FIELD_ENCRYPTION_KEY: test-encryption-key-32-bytes!!
          ENVIRONMENT: test
        run: pytest --maxfail=1 --disable-warnings -q

  frontend-tests:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
