# CI для проекта «Система учёта отпусков».
#
# Активируется полноценно после выполнения этапа M0 (docs/tasks.md), когда
# в репозитории появятся backend/pyproject.toml и frontend/package.json
# с ожидаемыми скриптами. До этого job'ы ожидаемо будут падать на шаге
# установки зависимостей — это нормально для пустого каркаса.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vacation_app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vacation_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vacation_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      # T-M1-49: fetch-depth 0, а не дефолтные 1 — tests/
      # test_task_checkbox_check.py строит фикстуры из настоящей истории
      # репозитория (`git show`/`git log` на мерж-коммитах PR #143/#144),
      # а неглубокий чекаут эти объекты не приносит вовсе (проверено
      # прогоном: `git cat-file -t <мерж-коммит PR #144>` в клоне
      # `--depth 1` отвечает "Not a valid object name", в полном —
      # резолвится). Остальные job'ы этого workflow в такую историю не
      # заглядывают, поэтому не тронуты.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run DB migrations (test DB)
        env:
          DATABASE_URL: postgresql+asyncpg://vacation_app:test@localhost:5432/vacation_tracker_test
        run: alembic upgrade head

      - name: Start test OpenLDAP
        working-directory: .
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/docker-compose.yml up -d openldap
          timeout 30 bash -c '
            until docker compose --env-file .env -f infra/docker-compose.yml \
                exec -T openldap ldapwhoami -x -H ldap://localhost:1389 \
                -D "cn=admin,dc=company,dc=local" -w changeme >/dev/null 2>&1; do
              sleep 1
            done
          '
          # Первый цикл проверяет slapd изнутри контейнера, этот — тот же
          # путь, которым пойдут тесты: опубликованный порт с хоста раннера.
          timeout 30 bash -c 'until (exec 3<>/dev/tcp/localhost/389) 2>/dev/null; do sleep 1; done'

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://vacation_app:test@localhost:5432/vacation_tracker_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
          LDAP_PASSWORD_ENCRYPTION_KEY: test-encryption-key-32-bytes!!
          ENVIRONMENT: test
          LDAP_TEST_HOST: localhost
          LDAP_TEST_PORT: "389"
          PYTEST_FORBID_SKIPS: "1"
        run: pytest --maxfail=1 --disable-warnings -q

  frontend-tests:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # T-M1-54: число ядер раннера ubuntu-latest зависит от типа
      # репозитория и менялось со временем GitHub-ом без объявления -
      # измерение режима прогона на неверном классе железа обесценивает
      # его целиком. Шаг постоянный и дешёвый: делает возможным будущий
      # разбор флака без догадок о том, на каком железе он случился.
      - name: Report runner CPU count
        run: |
          echo "nproc: $(nproc)"
          echo "node os.availableParallelism(): $(node -p 'os.availableParallelism?.() ?? os.cpus().length')"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

  e2e-tests:
    # T-M1-24: единственный прогон, проверяющий путь «вход по LDAP ->
    # карточка сотрудника» целиком — backend проверяется против настоящего
    # каталога, frontend — против подменённого fetch, а между ними до
    # этой задачи никто. Полный стек через docker compose (тот же образец,
    # что у backend-tests для openldap, здесь — весь infra/docker-
    # compose.yml) с оверрайдом `docker-compose.e2e.yml`: приложение
    # открывается через nginx (:80), как в прод-форме (plan.md §8), и
    # `VITE_API_BASE_URL` на этот прогон пуст — иначе браузер звал бы
    # backend напрямую через :8000, минуя nginx (проверено прогоном при
    # разработке этой задачи, см. комментарий у docker-compose.e2e.yml).
    name: E2E (Playwright, LDAP login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Версия браузера определяется локально установленным
      # @playwright/test (package-lock.json) - не отдельно закреплённым
      # номером здесь, чтобы те два места не могли разойтись.
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare .env
        run: cp .env.example .env

      - name: Start full stack (nginx + backend + frontend + test LDAP)
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml up -d

      # Опрос реального признака готовности в цикле с таймаутом - тот же
      # принцип, что у backend-tests (см. его шаг "Start test OpenLDAP"),
      # не sleep на фиксированное время.
      - name: Wait for test OpenLDAP
        run: |
          timeout 30 bash -c '
            until docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml \
                exec -T openldap ldapwhoami -x -H ldap://localhost:1389 \
                -D "cn=admin,dc=company,dc=local" -w changeme >/dev/null 2>&1; do
              sleep 1
            done
          '

      - name: Wait for the app through nginx
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost/healthz >/dev/null 2>&1; do sleep 1; done'
          timeout 60 bash -c 'until curl -sf http://localhost/login >/dev/null 2>&1; do sleep 1; done'

      - name: Run DB migrations
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.e2e.yml \
              exec -T backend alembic upgrade head

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  conflict-marker-check:
    # T-M1-51: 24.09.2026 при слиянии PR #149 файл docs/tasks.md попал в
    # main со служебными маркерами git внутри (исправлено в PR #151) — ни
    # тесты, ни CI на такие строки не смотрели, поэтому автоматически
    # этого не заметил никто. Отдельный job, не шаг внутри backend-tests/
    # frontend-tests: проверка репозитория целиком (docs/, скрипты,
    # workflow-файлы и т.д.), не только backend или frontend, и не должна
    # зависеть от того, ставятся ли их зависимости.
    name: No merge conflict markers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for conflict markers
        run: python3 scripts/check_conflict_markers.py

  task-checkbox-check:
    # T-M1-49: чек-бокс задачи (CLAUDE.md, правило 6) забывался в трёх PR
    # подряд (T-M1-45/PR #143, T-M1-18/PR #144, T-M1-48/PR #146) — ничто
    # не требовало отметки, она делалась последней в потоке работы и
    # выпадала. Только на pull_request (не push): у push-события нет ни
    # номера PR, ни его описания, а угадывать PR по коммиту — ровно тот
    # риск ложного срабатывания, которого эта проверка должна избегать
    # (см. scripts/check_task_checkbox.py).
    name: Task checkbox is ticked when its commits land
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # PR #156 review: без этого блока действует набор прав GITHUB_TOKEN
    # по умолчанию, в который чтение PR НЕ входит — `gh api .../pulls/
    # {n}/commits` отвечает 403 Resource not accessible by integration
    # (подтверждено настоящим прогоном на этом PR, не предположено).
    # `contents: read` нужен `actions/checkout`, `pull-requests: read` —
    # собственно чтению списка коммитов PR через `gh api`. Права выданы
    # только этому job'у, не всему workflow (`on:`/верхний уровень) —
    # остальные job'ы (backend-tests, frontend-tests и т.д.) не читают
    # PR через API и не должны получать более широкие права, чем нужно
    # им самим. Следующему читателю: не убирать этот блок как лишний —
    # без него job красный на каждом PR, не только иногда.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check task checkbox
        env:
          # `github.token` (= GITHUB_TOKEN) — тот же токен, что и у
          # остальных шагов этого workflow, но НЕ тот же набор прав: без
          # `permissions:` этого job'а (выше) чтение PR через `gh api`
          # отвечает 403 — утверждение "scope по умолчанию достаточен",
          # написанное в предыдущей версии этого комментария, было
          # опровергнуто именно этим прогоном (правило 8, не
          # переписывать вывод по рассуждению).
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Через env:, не подстановкой в run: — тело PR пишет тот, кто
          # его открывает, и вставка ${{ github.event.pull_request.body }}
          # прямо в текст команды была бы инъекцией в shell; так это
          # только переменная окружения процесса.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_task_checkbox.py

  basis-version-check:
    # T-M1-44: строка «Основание» в plan.md/tasks.md/ui.md — заявление о
    # прослеживаемости, а не оформление; устаревший номер делает
    # невозможным понять, учтён ли в артефакте последний пересмотр
    # документа, на который он опирается. Только на pull_request (не
    # push) — по той же причине, что у task-checkbox-check: у push нет
    # номера PR, и угадывать его было бы ровно тем риском ложного
    # срабатывания, которого эта проверка должна избегать.
    name: Основание cites the actual upstream version
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # См. комментарий у task-checkbox-check выше: без этого блока
    # `gh pr diff` отвечает 403 (тот же прогон, PR #156, применим и
    # здесь — оба скрипта читают список файлов/коммитов PR тем же
    # токеном с тем же набором прав).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Check Основание versions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_basis_version.py

  openapi-client-check:
    # T-M1-28: этот шаг проверяет расхождение между схемой backend и
    # сгенерированным TS-клиентом. Добавлен в первой ветке, где вообще
    # появляются эндпоинты (до этого схема была пустой, проверять было
    # нечего) — специально до того, как расхождений накопится несколько
    # веток и их придётся разгребать разом.
    name: Generated TS client matches backend schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c constraints.txt

      - name: Export OpenAPI schema
        working-directory: backend
        run: python scripts/export_openapi.py

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Generate TS client
        working-directory: frontend
        run: npm run generate:api

      - name: Fail if the generated client is out of date
        run: git diff --exit-code -- frontend/src/api/generated
