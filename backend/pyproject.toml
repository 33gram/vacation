[project]
name = "vacation-tracker-backend"
version = "0.1.0"
description = "Система учёта отпусков — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "ldap3>=2.9,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "bcrypt>=4.1,<5",
  "pyjwt>=2.9,<3",
  "cryptography>=42,<44",
  "python-multipart>=0.0.9",
  "aiosmtplib>=3.0,<4",
  "openpyxl>=3.1,<4",
  # Явная прямая зависимость (T-M2-34): `zoneinfo` читает пояс организации (NFR-LOC-002), и база
  # зон не должна держаться на том, что её тянет `kombu`.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<0.24",
  "httpx>=0.27,<0.28",
  "ruff>=0.5,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# W605 (недопустимая escape-последовательность в обычной строке,
# например `\d` вне `r"..."`) — PR #156 review: ровно это было в
# модульном докстринге scripts/check_task_checkbox.py, незамечено,
# потому что группа W не выбрана. Только W605, а не вся группа W:
# прогон `ruff check --select W .` по всему репозиторию на текущем
# дереве больше ничего в этой группе не находит — остальное осталось
# выключенным, раз сегодня не нужно, а не ради подстраховки на будущее
# открывать всю поверхность предупреждений pycodestyle (длина строки,
# пробелы на пустых строках и т.п.).
extend-select = ["W605"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `-rs` — причины пропусков (нужно PYTEST_FORBID_SKIPS, conftest.py).
# `-rf` — короткая сводка `FAILED <nodeid>` в конце ВСЕГДА, а не только
# при просмотре полного лога. `--tb=short` держит трассировку каждого
# падения компактной. Оба добавлены после PR #139 review (третий
# круг): полный `make test-backend` один раз дал «3 failed» без единого
# имени — длинный вывод обрезался раньше, чем до сводки. Имя упавшего
# теста обязано переживать обрезание вывода независимо от того, кто и
# как запускает прогон.
addopts = "-rfs --tb=short"
