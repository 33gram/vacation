# T-M1-24: оверрайд для прогона Playwright-сценариев.
#
# Приложение открывается через nginx (:80) — форма, близкая к
# прод-развёртыванию (plan.md §8), а не напрямую через :5173
# (Vite dev-сервер), где проверялась бы другая связка. Но сам по себе
# выбор адреса ничего не даёт без этой правки: базовый `docker-compose.yml`
# задаёт `frontend`'у `VITE_API_BASE_URL: http://localhost:8000`, и Vite
# подставляет это значение в выданный браузеру бандл буквально (проверено
# прогоном — см. тело коммита: `curl http://localhost/src/api/client.ts`
# через nginx отдаёт строку с "localhost:8000"). Значит браузер обращался
# бы к API напрямую через :8000, минуя nginx вовсе, и прокси-блок `/api/`
# в сценарии не участвовал бы — сценарий тестировал бы несуществующую
# развёртку. Пустая строка (см. комментарий у `apiClient` в
# `frontend/src/api/client.ts`) заставляет клиент слать относительные
# пути, которые нужно отдать тому же origin, что и страницу — то есть
# именно nginx, с его `/api/` location.
services:
  frontend:
    environment:
      VITE_API_BASE_URL: ""
