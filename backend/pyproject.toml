[project]
name = "vacation-tracker-backend"
version = "0.1.0"
description = "Система учёта отпусков — backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.30",
  "alembic>=1.13,<1.14",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "ldap3>=2.9,<3",
  "celery[redis]>=5.4,<6",
  "redis>=5.0,<6",
  "bcrypt>=4.1,<5",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.9",
  "aiosmtplib>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<0.24",
  "httpx>=0.27,<0.28",
  "ruff>=0.5,<0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
